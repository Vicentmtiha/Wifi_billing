<!DOCTYPE html>
<html>
<head>
    <title>Karibu WiFi Mtaani</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 text-center">
    <h3>WiFi Mtaani</h3>
    <p>Ingiza vocha uliyopata ili uunganishe internet</p>
    <form method="post" action="/hotspot-login">
        <div class="mb-3">
            <input type="text" name="voucher" class="form-control" placeholder="Weka Vocha Hapa" required>
            <input type="hidden" name="mac" value="$(mac)">
        </div>
        <button type="submit" class="btn btn-success w-100">Unganisha Sasa</button>
    </form>
</div>
</body>
</html>
