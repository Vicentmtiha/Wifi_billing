<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Vouchers — CORE-WISP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #090d16; font-family: 'JetBrains Mono', monospace; color: #e2e8f0; padding: 30px 15px; }
        .control-panel { max-width: 1000px; margin: 0 auto 30px auto; background: #0f172a; border: 1px solid #1e293b; padding: 15px 25px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); }
        .btn-back { color: #94a3b8; text-decoration: none; transition: 0.3s; }
        .btn-back:hover { color: #38bdf8; }
        .btn-neon-green { border: 1px solid #4ade80; color: #4ade80; background: transparent; font-weight: bold; }
        .btn-neon-green:hover { background: #4ade80; color: #090d16; box-shadow: 0 0 15px rgba(74, 222, 128, 0.6); }

        .voucher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .voucher-card { background: #0f172a; border: 2px dashed #38bdf8; border-radius: 8px; padding: 15px; position: relative; }
        .voucher-header { border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 10px; color: #64748b; font-size: 0.75rem; text-transform: uppercase; }
        .voucher-code { font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: 2px; margin-bottom: 12px; }
        .voucher-details { font-size: 0.85rem; color: #94a3b8; line-height: 1.6; }
        .voucher-details span { color: #38bdf8; font-weight: bold; }

        @media print {
            body { background-color: #fff !important; color: #000 !important; }
            .control-panel { display: none !important; }
            .voucher-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 10px !important; }
            .voucher-card { background: #fff !important; border: 1px dashed #000 !important; color: #000 !important; }
            .voucher-code { color: #000 !important; }
            .voucher-details { color: #000 !important; }
            .voucher-details span { color: #000 !important; }
        }
    </style>
</head>
<body>

    <div class="control-panel d-flex justify-content-between align-items-center">
        <a href="/vouchers" class="btn-back fw-bold"><i class="fa-solid fa-arrow-left me-2"></i> Rudi Kwenye Engine</a>
        <button onclick="window.print()" class="btn btn-neon-green px-4 py-2"><i class="fa-solid fa-print me-2"></i> Anza Kuchapisha</button>
    </div>

    <div class="voucher-grid">
        {% for v in vouchers %}
        <div class="voucher-card">
            <div class="voucher-header d-flex justify-content-between">
                <span><i class="fa-solid fa-wifi"></i> WiFi</span>
                <small>CORE</small>
            </div>
            <div class="voucher-code text-center">{{ v.code }}</div>
            <div class="voucher-details">
                <div><i class="fa-solid fa-tag"></i> Bei: <span>{{ v.price if v.price else "0" }} TSH</span></div>
                <div><i class="fa-solid fa-clock"></i> Muda: <span>{{ v.uptime or "N/A" }}</span></div>
                <div><i class="fa-solid fa-database"></i> Data: <span>{{ v.data_limit or "N/A" }}</span></div>
            </div>
        </div>
        {% else %}
        <div class="text-center text-muted w-100 py-5">Hakuna vocha za kuchapisha.</div>
        {% endfor %}
    </div>

</body>
</html>
