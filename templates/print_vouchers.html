<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Vouchers — CORE-WISP</title>
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --neon-cyan: #00f3ff;
            --neon-green: #00ff88;
            --bg: #030611;
            --card-bg: rgba(10, 16, 31, 0.85);
            --border: rgba(0, 243, 255, 0.3);
            --text: #f8fafc;
            --muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text);
            padding: 25px 15px;
            min-height: 100vh;
        }

        /* Cyber Grid Background for Screen View */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 20%, rgba(0, 243, 255, 0.04) 0%, transparent 70%),
                linear-gradient(90deg, rgba(0, 243, 255, 0.02) 1px, transparent 1px),
                linear-gradient(rgba(0, 243, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            z-index: -2;
        }

        /* Top Action Bar */
        .control-panel {
            max-width: 1100px;
            margin: 0 auto 30px auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(15px);
            padding: 16px 25px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .btn-back {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-back:hover {
            color: var(--neon-cyan);
            transform: translateX(-3px);
        }

        .btn-neon-green {
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            background: rgba(0, 255, 136, 0.05);
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        .btn-neon-green:hover {
            background: var(--neon-green);
            color: #030611;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        /* Grid Layout */
        .voucher-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Voucher Card Styling */
        .voucher-card {
            background: var(--card-bg);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .voucher-card:hover {
            transform: translateY(-3px);
            border-color: var(--neon-cyan);
        }

        .voucher-header {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: var(--neon-cyan);
            font-weight: 700;
        }

        .voucher-code-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            text-align: center;
        }

        .voucher-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            text-align: center;
            background: rgba(0, 243, 255, 0.05);
            padding: 6px 0;
            border-radius: 6px;
            border: 1px solid rgba(0, 243, 255, 0.15);
            margin-bottom: 12px;
        }

        .voucher-details {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        .voucher-details .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .voucher-details span {
            color: #fff;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        /* PRINT STYLES — PURE WHITE & BLACK OPTIMIZED FOR INK SAVING */
        @media print {
            body {
                background-color: #ffffff !important;
                background: none !important;
                color: #000000 !important;
                padding: 0 !important;
            }

            body::before {
                display: none !important;
            }

            .control-panel {
                display: none !important;
            }

            .voucher-grid {
                display: grid !important;
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 8px !important;
                max-width: 100% !important;
                margin: 0 !important;
            }

            .voucher-card {
                background: #ffffff !important;
                border: 1px dashed #000000 !important;
                border-radius: 4px !important;
                padding: 10px !important;
                color: #000000 !important;
                box-shadow: none !important;
                page-break-inside: avoid;
            }

            .voucher-header {
                border-bottom: 1px solid #000000 !important;
                color: #000000 !important;
            }

            .voucher-code-label {
                color: #000000 !important;
            }

            .voucher-code {
                background: #ffffff !important;
                color: #000000 !important;
                border: 1px solid #000000 !important;
            }

            .voucher-details {
                color: #000000 !important;
            }

            .voucher-details span {
                color: #000000 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div class="control-panel d-flex justify-content-between align-items-center">
        <a href="/vouchers" class="btn-back"><i class="fa-solid fa-arrow-left me-2"></i> Rudi Kwenye Voucher Engine</a>
        <button onclick="window.print()" class="btn btn-neon-green px-4 py-2">
            <i class="fa-solid fa-print me-2"></i> Anza Kuchapisha (Print)
        </button>
    </div>

    <!-- Voucher Grid -->
    <div class="voucher-grid">
        {% for v in vouchers %}
        <div class="voucher-card">
            <div class="voucher-header d-flex justify-content-between align-items-center">
                <span><i class="fa-solid fa-wifi me-1"></i> CORE-WISP</span>
                <small style="font-size: 9px; opacity: 0.8;">HOTSPOT</small>
            </div>
            
            <div class="voucher-code-label">CODE / PIN</div>
            <div class="voucher-code">{{ v.code }}</div>
            
            <div class="voucher-details">
                <div class="detail-item">
                    <span><i class="fa-solid fa-tag me-1"></i> Bei:</span>
                    <span>{{ v.price if v.price else "0" }} TSH</span>
                </div>
                <div class="detail-item">
                    <span><i class="fa-solid fa-clock me-1"></i> Muda:</span>
                    <span>{{ v.uptime or "N/A" }}</span>
                </div>
                <div class="detail-item">
                    <span><i class="fa-solid fa-database me-1"></i> Data:</span>
                    <span>{{ v.data_limit or "N/A" }}</span>
                </div>
            </div>
        </div>
        {% else %}
        <div class="text-center text-muted w-100 py-5">
            <i class="fa-solid fa-ticket-simple fa-3x mb-3" style="color: var(--border);"></i>
            <p>Hakuna vocha zozote za kuchapisha kwa sasa.</p>
        </div>
        {% endfor %}
    </div>

</body>
</html>
