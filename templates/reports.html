<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ripoti za Vocha — CORE-WISP</title>

<!-- Bootstrap 5.3 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --primary: #6366f1;
    --neon-cyan: #00f3ff;
    --neon-purple: #b537f2;
    --neon-green: #00ff88;
    --neon-red: #ff0055;
    --neon-orange: #ff9900;
    
    --bg: #030611;
    --card: rgba(10, 16, 31, 0.82);
    --border: rgba(0, 243, 255, 0.2);
    --text: #f8fafc;
    --muted: #64748b;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    position: relative;
    padding-bottom: 50px;
  }

  /* Cyber Grid Background */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 50% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 70%),
      linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
      linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    z-index: -2;
  }

  /* Page Title Header */
  .page-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #fff, var(--neon-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Buttons */
  .btn-cyber-outline {
    border: 1px solid var(--border);
    color: var(--neon-cyan);
    background: rgba(0, 243, 255, 0.03);
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    transition: all 0.3s ease;
    text-decoration: none;
  }

  .btn-cyber-outline:hover {
    background: var(--neon-cyan);
    color: #000;
    border-color: var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
  }

  /* Cyber Cards */
  .cyber-card {
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    position: relative;
    overflow: hidden;
    height: 100%;
  }

  .cyber-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  }

  .cyber-card-header {
    padding: 18px 24px;
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--neon-cyan);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 243, 255, 0.02);
  }

  /* Stat Cards */
  .stat-card {
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    position: relative;
    transition: all 0.3s ease;
  }

  .stat-card:hover {
    transform: translateY(-4px);
    border-color: var(--neon-cyan);
    box-shadow: 0 8px 25px rgba(0, 243, 255, 0.15);
  }

  .stat-icon {
    width: 45px;
    height: 45px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 15px;
  }

  .stat-number {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Specific Stat Box Glow Colors */
  .icon-issued { background: rgba(0, 243, 255, 0.1); color: var(--neon-cyan); border: 1px solid rgba(0, 243, 255, 0.3); }
  .num-issued { color: var(--neon-cyan); }

  .icon-used { background: rgba(181, 55, 242, 0.1); color: var(--neon-purple); border: 1px solid rgba(181, 55, 242, 0.3); }
  .num-used { color: var(--neon-purple); }

  .icon-unused { background: rgba(0, 255, 136, 0.1); color: var(--neon-green); border: 1px solid rgba(0, 255, 136, 0.3); }
  .num-unused { color: var(--neon-green); }

  .icon-expired { background: rgba(255, 0, 85, 0.1); color: var(--neon-red); border: 1px solid rgba(255, 0, 85, 0.3); }
  .num-expired { color: var(--neon-red); }

  /* Canvas area */
  .chart-container {
    position: relative;
    padding: 20px;
    min-height: 280px;
  }
</style>
</head>
<body>

<div class="container py-4">
  <!-- Top Navigation Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary border-opacity-25">
    <div>
      <h3 class="page-title mb-1"><i class="fa-solid fa-chart-pie me-2" style="color: var(--neon-cyan);"></i> RIPOTI ZA VOCHA</h3>
      <p class="text-muted small mb-0">Takwimu na uchambuzi wa matumizi pamoja na mauzo ya vocha</p>
    </div>
    <a href="/dashboard" class="btn btn-cyber-outline px-3 py-2 rounded-pill">
      <i class="fa-solid fa-house me-1"></i> Dashboard
    </a>
  </div>

  <!-- Takwimu kuu (Stat Cards) -->
  <div class="row g-3 mb-4">
    <!-- Issued -->
    <div class="col-md-3 col-sm-6">
      <div class="stat-card">
        <div class="stat-icon icon-issued">
          <i class="fa-solid fa-ticket"></i>
        </div>
        <div class="stat-number num-issued">{{ total_issued }}</div>
        <div class="stat-label">Vocha Zilizotolewa</div>
      </div>
    </div>

    <!-- Used -->
    <div class="col-md-3 col-sm-6">
      <div class="stat-card">
        <div class="stat-icon icon-used">
          <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="stat-number num-used">{{ total_used }}</div>
        <div class="stat-label">Vocha Zilizotumiwa</div>
      </div>
    </div>

    <!-- Unused -->
    <div class="col-md-3 col-sm-6">
      <div class="stat-card">
        <div class="stat-icon icon-unused">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <div class="stat-number num-unused">{{ total_unused }}</div>
        <div class="stat-label">Vocha Hazijatumiwa</div>
      </div>
    </div>

    <!-- Expired -->
    <div class="col-md-3 col-sm-6">
      <div class="stat-card">
        <div class="stat-icon icon-expired">
          <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
        <div class="stat-number num-expired">{{ total_expired }}</div>
        <div class="stat-label">Vocha Zilizoisha Muda</div>
      </div>
    </div>
  </div>

  <!-- Grafu za takwimu -->
  <div class="row g-4">
    <!-- Matumizi ya Vocha kwa Muda -->
    <div class="col-lg-6">
      <div class="cyber-card">
        <div class="cyber-card-header">
          <i class="fa-solid fa-chart-pie me-1"></i> HALI YA MATUMIZI YA VOCHA
        </div>
        <div class="chart-container d-flex align-items-center justify-content-center">
          <canvas id="usageChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Ripoti ya Mauzo -->
    <div class="col-lg-6">
      <div class="cyber-card">
        <div class="cyber-card-header">
          <i class="fa-solid fa-chart-column me-1"></i> UCHAMBUZI WA MAUZO (TSH)
        </div>
        <div class="chart-container d-flex align-items-center justify-content-center">
          <canvas id="salesChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Scripts za grafu -->
<script>
  // Set Global Chart Font Color for Dark Mode
  Chart.defaults.color = '#94a3b8';
  Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

  // Data za Vocha
  const vouchersData = {
    labels: ['Hazijatumiwa', 'Zimetumiwa', 'Zimeisha Muda'],
    datasets: [{
      label: 'Idadi ya Vocha',
      data: [{{ total_unused }}, {{ total_used }}, {{ total_expired }}],
      backgroundColor: ['#00ff88', '#b537f2', '#ff0055'],
      borderColor: '#0a101f',
      borderWidth: 3,
      hoverOffset: 8
    }]
  };

  // Data za Mauzo
  const salesData = {
    labels: ['Mauzo ya Jumla', 'Lengo la Mwezi'],
    datasets: [{
      label: 'Kiasi (TSH)',
      data: [{{ total_sales }}, 0], // Badilisha 0 kwa kiasi cha lengo kama kipo
      backgroundColor: ['#00f3ff', '#6366f1'],
      borderRadius: 8,
      borderWidth: 0
    }]
  };

  // Kuweka grafu ya Doughnut/Pie
  const ctxUsage = document.getElementById('usageChart').getContext('2d');
  new Chart(ctxUsage, {
    type: 'doughnut',
    data: vouchersData,
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { 
          position: 'bottom',
          labels: {
            padding: 20,
            usePointStyle: true,
            font: { size: 12, weight: '600' }
          }
        },
        tooltip: {
          backgroundColor: '#0a101f',
          borderColor: 'rgba(0, 243, 255, 0.3)',
          borderWidth: 1,
          padding: 12,
          displayColors: true
        }
      },
      cutout: '65%'
    }
  });

  // Kuweka grafu ya Bar
  const ctxSales = document.getElementById('salesChart').getContext('2d');
  new Chart(ctxSales, {
    type: 'bar',
    data: salesData,
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0a101f',
          borderColor: 'rgba(0, 243, 255, 0.3)',
          borderWidth: 1,
          padding: 12
        }
      },
      scales: {
        x: {
          grid: { display: false }
        },
        y: {
          beginAtZero: true,
          grid: { color: 'rgba(255, 255, 255, 0.05)' }
        }
      }
    }
  });
</script>

</body>
</html>
