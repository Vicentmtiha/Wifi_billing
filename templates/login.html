<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>wifi billing - Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Optional: Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  body {
    background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
    font-family: 'Arial', sans-serif;
  }

  .card {
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
  }

  h3 {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .btn-primary {
    background-color: #007bff;
    border: none;
    transition: background-color 0.3s ease;
  }

  .btn-primary:hover {
    background-color: #0056b3;
  }

  /* Optional: Add some animation to the form */
  .form-container {
    animation: fadeInUp 1s ease-in-out;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Make the form look more centered and stylish */
  .form-label {
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="row w-100">
        <div class="col-md-6 mx-auto">
            <div class="card shadow p-4">
                <div class="card-body">
                    <h3 class="text-center mb-4 text-primary">wifi billing</h3>

                    <!-- Form -->
                    <form autocomplete="off" name="login" action="/login" method="POST" class="form-container">

                        <div class="mb-3">
                            <label class="form-label text-muted small">Username</label>
                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Weka Username"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">Password</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Weka Password"
                                required>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100 mt-3">
                            Ingia kwenye Dashboard
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
