<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE-WISP | Ultra Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw; height: 100vh;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(2, 6, 23, 0.4), rgba(2, 6, 23, 0.5)),
                        url('/static/background.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 40px 35px 30px 35px;
            border-radius: 30px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(56, 189, 248, 0.1);
            position: relative;
            z-index: 10;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 { 
            font-family: 'Orbitron', sans-serif; 
            color: #fff; 
            letter-spacing: 4px; 
            font-size: 24px;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }

        .input-group { margin-bottom: 20px; text-align: left; }

        .input-group label {
            display: block;
            color: #38bdf8;
            font-size: 10px;
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            background: rgba(2, 6, 23, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 14px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.4); }

        input:focus { 
            border-color: #38bdf8; 
            background: rgba(2, 6, 23, 0.7);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .toggle-password {
            position: absolute; 
            right: 15px; 
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer; 
            font-size: 16px;
            user-select: none;
            opacity: 0.7;
            transition: 0.2s;
        }

        .toggle-password:hover { opacity: 1; }

        /* Mtindo wa Forgot Password */
        .forgot-pass-wrapper {
            text-align: right;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        .forgot-pass-link {
            color: #38bdf8;
            font-size: 12px;
            text-decoration: none;
            transition: 0.2s;
        }

        .forgot-pass-link:hover {
            color: #7dd3fc;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            text-decoration: underline;
        }

        .btn-auth {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
        }

        .btn-auth:hover { 
            background: linear-gradient(135deg, #0284c7, #1d4ed8); 
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.6);
        }

        /* Mtindo wa sehemu ya Register */
        .register-section {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }

        .register-section a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .register-section a:hover {
            color: #7dd3fc;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
            text-decoration: underline;
        }

        /* Sehemu ya Msaada & WhatsApp Verification */
        .support-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed rgba(56, 189, 248, 0.25);
            text-align: center;
            font-size: 11px;
            color: #cbd5e1;
        }

        .support-title {
            font-size: 10px;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .support-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .support-link {
            color: #e2e8f0;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .support-link:hover {
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        .footer-credits {
            text-align: center;
            margin-top: 15px;
            border-top: 1px solid rgba(56, 189, 248, 0.2);
            padding-top: 12px;
        }

        .footer-credits p {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            color: #94a3b8;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .footer-credits span {
            color: #38bdf8;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .alert-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 12.5px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <h2>CORE-WISP</h2>
        </div>

        {% if success %}
        <div class="alert-box alert-success">
            <span>✅</span>
            <div>{{ success }}</div>
        </div>
        {% endif %}

        {% if error %}
        <div class="alert-box alert-error">
            <span>⚠️</span>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="input-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <input type="text" name="username" required autocomplete="off" placeholder="Enter username">
                </div>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="pass" name="password" required placeholder="••••••••">
                    <span class="toggle-password" onclick="togglePass()">👁️</span>
                </div>
                <!-- Sehemu ya Forgot Password (Inaelekeza Email) -->
                <div class="forgot-pass-wrapper">
                    <a href="/forgot-password" class="forgot-pass-link">Umesahau Nywila?</a>
                </div>
            </div>

            <button type="submit" class="btn-auth">LOGIN</button>
        </form>

        <!-- Sehemu ya kwenda kujisajili (Register) -->
        <div class="register-section">
            Huna akaunti? <a href="/register">Jisajili hapa</a>
        </div>

        <!-- Mawasiliano & WhatsApp Verification -->
        <div class="support-section">
            <div class="support-title">Msaada Zaidi & Verification</div>
            <div class="support-links">
                <a href="mailto:vicentmtiha4@gmail.com" class="support-link">
                    📧 Email: vicentmtiha4@gmail.com
                </a>
                <a href="javascript:void(0)" onclick="openWhatsApp('255627404930')" class="support-link">
                    💬 WhatsApp: 0627404930
                </a>
                <a href="javascript:void(0)" onclick="openWhatsApp('255794204930')" class="support-link">
                    💬 WhatsApp: 0794204930
                </a>
            </div>
        </div>

        <div class="footer-credits">
            <p>Developed by <span>Venom Company</span></p>
        </div>
    </div>

    <script>
        function togglePass() {
            var x = document.getElementById("pass");
            x.type = (x.type === "password") ? "text" : "password";
        }

        // Script ya kumleta mtumiaji WhatsApp
        function openWhatsApp(phone) {
            var message = encodeURIComponent("Habari, naomba msaada wa verification / huduma kwenye mfumo wa CORE-WISP.");
            window.open("https://wa.me/" + phone + "?text=" + message, "_blank");
        }
    </script>
</body>
</html>
