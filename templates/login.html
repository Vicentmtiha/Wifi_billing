<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — CORE-WISP</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;
      --neon-cyan: #00f3ff;
      --bg: #030611;
      --card-bg: rgba(10, 16, 31, 0.85);
      --border: rgba(0, 243, 255, 0.25);
      --text: #f8fafc;
      --muted: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Cyber Grid Background Effect */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.08) 0%, transparent 60%),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      z-index: -1;
    }

    /* Glowing Card */
    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 243, 255, 0.1);
      position: relative;
      overflow: hidden;
      max-width: 420px;
      width: 100%;
      animation: fadeInUp 0.8s ease-in-out;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px auto;
      color: var(--neon-cyan);
      font-size: 24px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #fff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Form Elements */
    .form-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .input-group-text {
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--neon-cyan);
      border-right: none;
    }

    .cyber-input {
      background: rgba(5, 9, 20, 0.8) !important;
      border: 1px solid var(--border) !important;
      color: #fff !important;
      font-size: 14px;
      padding: 12px 14px;
    }

    .cyber-input:focus {
      border-color: var(--neon-cyan) !important;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.25) !important;
    }

    .cyber-input::placeholder {
      color: var(--muted) !important;
    }

    /* Button Styling */
    .btn-cyber-primary {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(99, 102, 241, 0.4));
      border: 1px solid var(--neon-cyan);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 12px;
      border-radius: 10px;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-cyber-primary:hover {
      background: var(--neon-cyan);
      color: #030611;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
      transform: translateY(-2px);
    }

    .toggle-password {
      cursor: pointer;
      background: rgba(5, 9, 20, 0.8);
      border: 1px solid var(--border);
      border-left: none;
      color: var(--muted);
      transition: color 0.3s;
    }

    .toggle-password:hover {
      color: var(--neon-cyan);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<div class="container d-flex justify-content-center px-3">
  <div class="login-card p-4 p-md-5">
    
    <!-- Header Branding -->
    <div class="brand-logo">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h3 class="brand-title">CORE-WISP</h3>
    <p class="brand-subtitle"><i class="fa-solid fa-lock me-1"></i> Admin Authentication</p>

    <!-- Login Form -->
    <form autocomplete="off" action="/login" method="POST">

      <!-- Username Input -->
      <div class="mb-3">
        <label class="form-label">USERNAME</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
          <input
            type="text"
            name="username"
            class="form-control cyber-input"
            placeholder="Weka Admin Username"
            required>
        </div>
      </div>

      <!-- Password Input -->
      <div class="mb-4">
        <label class="form-label">PASSWORD</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
          <input
            type="password"
            id="passwordInput"
            name="password"
            class="form-control cyber-input"
            placeholder="Weka Admin Password"
            required>
          <span class="input-group-text toggle-password" onclick="togglePassword()">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </span>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-cyber-primary mt-2">
        <i class="fa-solid fa-right-to-bracket me-2"></i> INGIA DASHBOARD
      </button>

    </form>
    
    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
      <small class="text-muted" style="font-size: 10px;">&copy; CORE-WISP System • Automated Hotspot Billing</small>
    </div>

  </div>
</div>

<script>
  function togglePassword() {
    const passInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (passInput.type === 'password') {
      passInput.type = 'text';
      eyeIcon.classList.remove('fa-eye');
      eyeIcon.classList.add('fa-eye-slash');
    } else {
      passInput.type = 'password';
      eyeIcon.classList.remove('fa-eye-slash');
      eyeIcon.classList.add('fa-eye');
    }
  }
</script>

</body>
</html>
