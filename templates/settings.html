<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings — CORE-WISP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #090d16; 
            font-family: 'JetBrains Mono', monospace; 
            color: #e2e8f0;
        }
        .sidebar {
            background-color: #020617;
            border-right: 1px solid #1e293b;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .sidebar .nav-link {
            color: #94a3b8;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            text-decoration: none;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #1e1b4b;
            color: #38bdf8;
        }
        .cyber-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .cyber-card-header {
            background: linear-gradient(90deg, #1e1b4b 0%, #0f172a 100%);
            border-bottom: 2px solid #e11d48; /* Rangi ya neon nyekundu kwa ajili ya Settings */
            padding: 15px 20px;
            font-weight: bold;
            color: #f43f5e;
        }
        .cyber-input {
            background-color: #020617;
            border: 1px solid #334155;
            color: #fff;
        }
        .cyber-input:focus {
            background-color: #020617;
            border-color: #f43f5e;
            color: #fff;
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.3);
        }
        .btn-neon-rose {
            border: 1px solid #f43f5e; color: #f43f5e; background: transparent;
        }
        .btn-neon-rose:hover {
            background: #f43f5e; color: #090d16; box-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
        }
        .section-title {
            color: #38bdf8;
            border-bottom: 1px dashed #334155;
            padding-bottom: 5px;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3 col-lg-2 sidebar">
            <h4 class="text-white fw-bold mb-4 px-2"><i class="fa-solid fa-broadcast-tower text-primary me-2"></i>CORE-WISP</h4>
            <div class="nav flex-column">
                <a href="/dashboard" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Overview Dashboard</a>
                <a href="/vouchers" class="nav-link"><i class="fa-solid fa-ticket"></i> Voucher Engine</a>
                <a href="/packages" class="nav-link"><i class="fa-solid fa-box"></i> Tariff Plans</a>
                <a href="/users" class="nav-link"><i class="fa-solid fa-users"></i> User Control</a>
                <a href="/settings" class="nav-link active"><i class="fa-solid fa-gear"></i> System Settings</a>
                <a href="/logout" class="nav-link text-danger mt-5"><i class="fa-solid fa-sign-out-alt"></i> Toka (Logout)</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-white">System Settings</h2>
                    <small class="text-muted">Sanidi vigezo vya mfumo na mawasiliano ya MikroTik Router</small>
                </div>
            </div>

            <!-- Card Kuu ya Mipangilio -->
            <div class="cyber-card">
                <div class="cyber-card-header">
                    <i class="fa-solid fa-sliders me-2"></i>Mfumo Mkuu & Configuration Panel
                </div>
                <div class="cyber-card-body p-4">
                    <form action="/save-settings" method="POST">
                        
                        <!-- SEHEMU YA 1: MIPANGILIO YA UTANBULISHO WA MFUMO -->
                        <div class="section-title">
                            <i class="fa-solid fa-circle-info me-2"></i> General Information
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label text-muted small text-uppercase fw-bold">Jina la Mfumo (System Name)</label>
                                <input type="text" name="system_name" class="form-control cyber-input" value="CORE-WISP" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small text-uppercase fw-bold">Kiwango cha Kodi / Ushuru (%)</label>
                                <input type="number" name="tax_rate" class="form-control cyber-input" value="0" placeholder="Mfano: 18">
                            </div>
                        </div>

                        <!-- SEHEMU YA 2: MIPANGILIO YA MIKROTIK ROUTERBOARD -->
                        <div class="section-title">
                            <i class="fa-solid fa-network-wired me-2"></i> MikroTik RouterOS API Connection
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label text-muted small text-uppercase fw-bold">IP Address ya Router</label>
                                <input type="text" name="mikrotik_ip" class="form-control cyber-input" placeholder="Mfano: 192.168.88.1" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small text-uppercase fw-bold">API Port</label>
                                <input type="number" name="mikrotik_port" class="form-control cyber-input" value="8728" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small text-uppercase fw-bold">Hotspot Profile Name</label>
                                <input type="text" name="hotspot_profile" class="form-control cyber-input" value="hsprof1" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small text-uppercase fw-bold">API Username</label>
                                <input type="text" name="mikrotik_user" class="form-control cyber-input" placeholder="admin" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small text-uppercase fw-bold">API Password</label>
                                <input type="password" name="mikrotik_pass" class="form-control cyber-input" placeholder="••••••••">
                            </div>
                        </div>

                        <!-- Button ya Ku-save -->
                        <div class="text-end border-top border-secondary pt-3 mt-4">
                            <button type="submit" class="btn btn-neon-rose px-5 py-2 fw-bold">
                                <i class="fa-solid fa-floppy-disk me-2"></i> Hifadhi Mipangilio (Save Settings)
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
