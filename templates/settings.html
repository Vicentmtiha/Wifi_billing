<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>System Settings — CORE-WISP</title>
  
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --primary: #6366f1;
      --neon-cyan: #00f3ff;
      --neon-purple: #b537f2;
      --neon-rose: #ff0055;
      --neon-green: #00ff88;
      
      --bg: #030611;
      --card: rgba(10, 16, 31, 0.82);
      --border: rgba(255, 0, 85, 0.25);
      --border-cyan: rgba(0, 243, 255, 0.2);
      --text: #f8fafc;
      --muted: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      position: relative;
    }

    /* Cyber Grid Background */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 50% 20%, rgba(255, 0, 85, 0.04) 0%, transparent 70%),
        linear-gradient(90deg, rgba(255, 0, 85, 0.02) 1px, transparent 1px),
        linear-gradient(rgba(255, 0, 85, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      z-index: -2;
    }

    /* Sidebar Styling */
    .sidebar {
      background: rgba(2, 6, 23, 0.95);
      border-right: 1px solid var(--border-cyan);
      min-height: 100vh;
      padding: 25px 18px;
      backdrop-filter: blur(15px);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      margin-bottom: 6px;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .nav-link:hover {
      color: var(--neon-cyan);
      background: rgba(0, 243, 255, 0.05);
      border-color: rgba(0, 243, 255, 0.2);
      transform: translateX(4px);
    }

    .nav-link.active {
      color: #fff;
      background: linear-gradient(90deg, rgba(255, 0, 85, 0.25), rgba(99, 102, 241, 0.15));
      border-color: var(--neon-rose);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
    }

    /* Cyber Card */
    .cyber-card {
      background: var(--card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .cyber-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-rose), transparent);
    }

    .cyber-card-header {
      padding: 18px 24px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--neon-rose);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 0, 85, 0.03);
    }

    /* Section Titles */
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--neon-cyan);
      letter-spacing: 0.5px;
      border-bottom: 1px dashed rgba(0, 243, 255, 0.25);
      padding-bottom: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }

    /* Form Inputs */
    .form-label {
      font-size: 11px;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .input-group-text {
      background: rgba(255, 0, 85, 0.05);
      border: 1px solid var(--border);
      color: var(--neon-rose);
      border-right: none;
    }

    .cyber-input {
      background: rgba(5, 9, 20, 0.8) !important;
      border: 1px solid var(--border) !important;
      color: #fff !important;
      font-size: 14px;
      padding: 10px 14px;
      font-family: 'JetBrains Mono', monospace;
    }

    .cyber-input:focus {
      border-color: var(--neon-rose) !important;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.25) !important;
    }

    .cyber-input::placeholder {
      color: var(--muted) !important;
    }

    /* Buttons */
    .btn-neon-rose {
      background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(99, 102, 241, 0.3));
      border: 1px solid var(--neon-rose);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      border-radius: 10px;
    }

    .btn-neon-rose:hover {
      background: linear-gradient(135deg, var(--neon-rose), var(--primary));
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
      transform: translateY(-2px);
    }

    @media(max-width: 768px){
      .sidebar {
        min-height: auto;
        padding: 15px;
      }
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">
    <!-- Sidebar Navigation -->
    <nav class="col-md-3 col-lg-2 sidebar d-flex flex-column">
      <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <i class="fa-solid fa-broadcast-tower fa-lg" style="color: var(--neon-cyan);"></i>
        <h4 class="brand-title mb-0">CORE-WISP</h4>
      </div>
      
      <a href="/dashboard" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Overview Dashboard</a>
      <a href="/vouchers" class="nav-link"><i class="fa-solid fa-ticket"></i> Voucher Engine</a>
      <a href="/packages" class="nav-link"><i class="fa-solid fa-box"></i> Tariff Plans</a>
      <a href="/users" class="nav-link"><i class="fa-solid fa-users"></i> User Control</a>
      <a href="/settings" class="nav-link active"><i class="fa-solid fa-gear"></i> System Settings</a>
      
      <a href="/logout" class="nav-link mt-auto text-danger border-danger border-opacity-25">
        <i class="fa-solid fa-right-from-bracket"></i> Toka (Logout)
      </a>
    </nav>

    <!-- Main Content -->
    <main class="col-md-9 col-lg-10 p-4">
      
      <!-- Top Header -->
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary border-opacity-25">
        <div>
          <h2 class="fw-bold mb-1" style="font-family: 'Orbitron'; font-size: 24px; color: #fff;">
            SYSTEM SETTINGS
          </h2>
          <small class="text-muted">Sanidi vigezo vya mfumo na mawasiliano ya MikroTik Router</small>
        </div>
      </div>

      <!-- Card Kuu ya Mipangilio -->
      <div class="cyber-card">
        <div class="cyber-card-header">
          <i class="fa-solid fa-sliders me-2"></i> MFUMO MKUU & CONFIGURATION PANEL
        </div>
        <div class="cyber-card-body p-4">
          <form action="/save-settings" method="POST">
            
            <!-- SEHEMU YA 1: MIPANGILIO YA UTANBULISHO WA MFUMO -->
            <div class="section-title">
              <i class="fa-solid fa-circle-info me-2"></i> GENERAL INFORMATION
            </div>
            
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label">JINA LA MFUMO (SYSTEM NAME)</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-server"></i></span>
                  <input type="text" name="system_name" class="form-control cyber-input" value="CORE-WISP" required>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label">KIWANGO CHA KODI / USHURU (%)</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-percent"></i></span>
                  <input type="number" name="tax_rate" class="form-control cyber-input" value="0" placeholder="Mfano: 18">
                </div>
              </div>
            </div>

            <!-- SEHEMU YA 2: MIPANGILIO YA MIKROTIK ROUTERBOARD -->
            <div class="section-title">
              <i class="fa-solid fa-network-wired me-2"></i> MIKROTIK ROUTEROS API CONNECTION
            </div>
            
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label">IP ADDRESS YA ROUTER</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-globe"></i></span>
                  <input type="text" name="mikrotik_ip" class="form-control cyber-input" placeholder="Mfano: 192.168.88.1" required>
                </div>
              </div>

              <div class="col-md-4">
                <label class="form-label">API PORT</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-plug"></i></span>
                  <input type="number" name="mikrotik_port" class="form-control cyber-input" value="8728" required>
                </div>
              </div>

              <div class="col-md-4">
                <label class="form-label">HOTSPOT PROFILE NAME</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-wifi"></i></span>
                  <input type="text" name="hotspot_profile" class="form-control cyber-input" value="hsprof1" required>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label">API USERNAME</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-user-shield"></i></span>
                  <input type="text" name="mikrotik_user" class="form-control cyber-input" placeholder="admin" required>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label">API PASSWORD</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                  <input type="password" name="mikrotik_pass" class="form-control cyber-input" placeholder="••••••••">
                </div>
              </div>
            </div>

            <!-- Button ya Ku-save -->
            <div class="text-end border-top border-secondary border-opacity-25 pt-4 mt-2">
              <button type="submit" class="btn btn-neon-rose px-5 py-3 fw-bold">
                <i class="fa-solid fa-floppy-disk me-2"></i> HIFADHI MIPANGILIO (SAVE SETTINGS)
              </button>
            </div>

          </form>
        </div>
      </div>

    </main>
  </div>
</div>

</body>
</html>
