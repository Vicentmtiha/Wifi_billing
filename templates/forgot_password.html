<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CORE-WISP Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 50px -10px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Ambient Glows -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Card Container -->
    <div class="w-full max-w-md glass-card rounded-2xl p-8 shadow-2xl glow-effect relative z-10">
        
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 mb-4 text-2xl shadow-inner">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-white mb-1">Umesahau Password?</h2>
            <p class="text-sm text-slate-400">Weka email yako ili kupokea maelekezo ya kubadilisha password.</p>
        </div>

        <!-- Alert Notification -->
        {% if success %}
        <div class="mb-6 p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-start space-x-3">
            <i class="fa-solid fa-circle-check text-emerald-400 text-lg mt-0.5"></i>
            <p class="text-xs text-emerald-300 leading-relaxed">{{ success }}</p>
        </div>
        {% endif %}

        <!-- Form Section -->
        <form action="/forgot-password" method="POST" class="space-y-6">
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </div>
                    <input type="email" id="email" name="email" required
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all duration-200"
                        placeholder="mfano@domain.com">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-medium rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition-all duration-200 transform active:scale-[0.98] flex items-center justify-center space-x-2">
                <span>Tuma Maelekezo</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="mt-8 text-center pt-6 border-t border-slate-800/80">
            <a href="/login" class="inline-flex items-center text-xs font-medium text-slate-400 hover:text-indigo-400 transition-colors duration-200 group">
                <i class="fa-solid fa-arrow-left mr-2 transform group-hover:-translate-x-1 transition-transform duration-200"></i>
                Rudi kwenye Login
            </a>
        </div>

    </div>

</body>
</html>
